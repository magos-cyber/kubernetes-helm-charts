apiVersion: v2
name: monitoring-stack
description: Complete monitoring stack for homelab (Prometheus + Grafana)
type: application
version: 1.0.0
appVersion: "1.0"

dependencies:
  - name: prometheus
    version: "25.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: "7.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
